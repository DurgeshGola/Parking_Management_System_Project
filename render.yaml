services:
  - type: web
    name: park-ease-api
    runtime: node
    plan: free
    rootDir: Park-Ease/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: park-ease-web
    runtime: static
    plan: free
    rootDir: Park-Ease/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: park-ease-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
